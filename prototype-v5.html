<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do Franqueado PHIQ — V5</title><style>
:root{--p:#2e837f;--pd:#075a58;--deep:#053e3c;--o:#f78f1e;--y:#ffd917;--ink:#0f3332;--muted:#6d8481;--line:#dce8e6;--soft:#edf7f5;--bg:#f6faf9;--sh:0 14px 38px rgba(10,62,59,.07);--e:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{position:fixed;inset:0 auto 0 0;width:255px;background:white;border-right:1px solid var(--line);padding:19px 13px;display:flex;flex-direction:column;z-index:5}.logo{padding:0 11px 14px}.logo img{width:165px}.logo span{display:block;margin-left:12px;font-size:9px;letter-spacing:.15em;color:#64827f;text-transform:uppercase;font-weight:800}.nav{display:grid;gap:4px;margin-top:12px}.nav button{border:0;background:transparent;color:#3f5f5c;border-radius:13px;min-height:43px;padding:0 14px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;text-align:left;position:relative;transition:.22s var(--e)}.nav button:hover{background:#f1f8f7;transform:translateX(2px)}.nav button.active{background:linear-gradient(110deg,var(--p),#45a49e);color:white;box-shadow:0 9px 23px rgba(46,131,127,.18)}.nav button.active:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--y);position:absolute;right:11px}.side-title{font-size:8px;letter-spacing:.18em;font-weight:900;color:#8ca4a1;padding:22px 12px 8px}.shortcuts{display:grid;gap:4px}.shortcuts div{height:37px;border-radius:10px;padding:0 11px;display:flex;gap:9px;align-items:center;color:#617a77;font-size:10px}.shortcuts i{width:26px;height:26px;border-radius:8px;background:var(--p);color:white;display:grid;place-items:center;font-style:normal}.help{margin-top:auto;border:1px solid #d7e8e5;background:linear-gradient(145deg,#f7fcfb,#eaf7f5);border-radius:17px;padding:12px}.help strong,.help span{display:block}.help strong{font-size:10px}.help span{font-size:8px;color:var(--muted)}.help button{margin-top:9px;width:100%;border:0;background:var(--p);color:white;border-radius:10px;height:34px;font-size:9px;font-weight:800}.main{grid-column:2}.top{height:70px;position:sticky;top:0;z-index:4;background:rgba(255,255,255,.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:18px}.search{width:min(570px,55vw);height:39px;border:1px solid #d5e4e2;border-radius:14px;background:#fbfdfd;display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--p)}.search input{border:0;outline:0;background:transparent;flex:1;font-size:10px}.profile{margin-left:auto;display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--pd);color:white;display:grid;place-items:center;font-size:10px;font-weight:800}.profile strong,.profile span{display:block}.profile strong{font-size:10px}.profile span{font-size:8px;color:var(--muted)}.stage{max-width:1330px;margin:auto;padding:28px 35px 55px}.screen{animation:in .42s var(--e) both}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eaf6f4;color:var(--pd);font-size:7px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.45fr .82fr;gap:26px;align-items:center;min-height:280px}.hero h1{font-size:48px;line-height:1.01;letter-spacing:-.052em;margin:16px 0 13px}.hero h1 span,.intro h1 span{color:var(--p)}.hero p,.intro p{font-size:11px;line-height:1.65;color:var(--muted)}.buttons{display:flex;gap:8px;margin-top:20px}.btn{border:0;border-radius:12px;background:linear-gradient(105deg,var(--pd),var(--p));color:white;padding:11px 14px;font-size:9px;font-weight:800;transition:.22s var(--e)}.btn:hover{transform:translateY(-2px)}.btn.ghost{background:white;color:var(--pd);border:1px solid var(--line)}.banner{height:230px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}.banner img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease}.banner:hover img{transform:scale(1.025)}.grid3{display:grid;grid-template-columns:1.7fr .9fr .9fr;gap:13px}.panel{background:white;border:1px solid var(--line);border-radius:19px;box-shadow:var(--sh);padding:17px}.panel h3{font-size:13px;margin:0}.eyebrow{font-size:7px;font-weight:900;letter-spacing:.12em;color:var(--p)}.progress{display:grid;grid-template-columns:130px 1fr;gap:13px;align-items:center;margin-top:10px}.ring{width:125px;height:125px;border-radius:50%;background:conic-gradient(var(--p) 58%,#e4eeec 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:11px;background:white;border-radius:50%}.ring b,.ring small{z-index:1;position:relative;display:block;text-align:center}.ring b{font-size:24px}.ring small{font-size:8px;color:var(--muted)}.ptext strong,.ptext span{display:block}.ptext span{font-size:8px;color:var(--muted)}.ptext strong{font-size:16px;color:var(--p);margin-top:2px}.ptext p{font-size:9px;color:var(--muted);line-height:1.5}.bar{height:6px;background:#e8f0ef;border-radius:6px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:70%;background:linear-gradient(90deg,var(--o),#ffb31e)}.level{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff5a8,#ffd22b 45%,#f39b19);display:grid;place-items:center;font-size:25px}.coin{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(80,50,5,.18));transition:.3s var(--e)}.coinitem:hover .coin{transform:translateY(-6px) scale(1.06) rotate(-2deg)}.coins{display:grid;grid-template-columns:repeat(8,minmax(105px,1fr));gap:6px;overflow-x:auto;margin-top:10px}.coinitem{text-align:center;font-size:8px}.coinitem strong{display:block}.coinitem.locked{opacity:.55;filter:grayscale(1)}.sectiontitle{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px}.sectiontitle h2{font-size:22px;margin:8px 0 4px}.sectiontitle p{font-size:10px;color:var(--muted);margin:0}.twocol{display:grid;grid-template-columns:1.15fr .85fr;gap:13px}.feed{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #edf2f1}.feed:first-of-type{margin-top:10px}.feed i{width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--p);font-style:normal}.feed strong,.feed span{display:block}.feed strong{font-size:10px}.feed span{font-size:8px;color:var(--muted)}.feed time{font-size:8px;color:#91a5a2}.event{display:grid;grid-template-columns:45px 1fr;gap:10px;padding:10px 0;border-top:1px solid #edf2f1}.date{width:43px;height:43px;border-radius:11px;background:#fff4e5;display:grid;place-items:center;color:#9b651b;font-size:9px;font-weight:900}.event strong,.event span{display:block}.event strong{font-size:9px}.event span{font-size:8px;color:var(--muted)}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.smallcard{border:1px solid var(--line);background:white;border-radius:16px;padding:14px;box-shadow:var(--sh);transition:.22s var(--e)}.smallcard:hover{transform:translateY(-4px)}.smallcard strong,.smallcard span{display:block}.smallcard span{font-size:7px;color:var(--p);font-weight:900}.smallcard strong{font-size:11px;margin-top:5px}.intro{max-width:900px;margin:15px 0 25px}.intro h1{font-size:42px;line-height:1.05;letter-spacing:-.045em;margin:14px 0 10px}.knowledge{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kcard{min-height:190px}.knum{font-size:32px;color:#dfedeb;font-weight:900}.kcard h3{font-size:14px;margin:24px 0 6px}.kcard p{font-size:9px;line-height:1.5;color:var(--muted)}.detail{display:none}.back{border:0;background:transparent;color:var(--p);font-size:9px;font-weight:800;margin-bottom:15px}.accordion{border:1px solid var(--line);border-radius:15px;background:white;margin-bottom:9px;overflow:hidden}.accordion summary{cursor:pointer;padding:14px 15px;font-size:11px;font-weight:800;list-style:none}.accordion div{border-top:1px solid #edf2f1;padding:14px 18px;font-size:9px;color:#58716f;line-height:1.6}.rail{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:20px 20px 25px}.rail:before{content:"";position:absolute;left:10%;right:10%;top:24px;height:3px;background:#dde8e6}.rail:after{content:"";position:absolute;left:10%;width:36%;top:24px;height:3px;background:var(--p)}.step{z-index:1;text-align:center}.node{width:48px;height:48px;border-radius:50%;margin:auto;background:white;border:2px solid #d6e4e2;display:grid;place-items:center}.done .node{background:var(--p);color:white;border-color:#a9d6d2}.step strong,.step span{display:block}.step strong{font-size:9px;margin-top:6px}.step span{font-size:7px;color:var(--muted)}.mapgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:13px}.map{height:480px;background:radial-gradient(circle at 50% 40%,#fafdfc,#edf7f5 65%);border-radius:17px}.map svg{width:100%;height:100%}.shape{fill:#cbe7e3;stroke:#7dbbb5;stroke-width:2}.pin{fill:var(--o);stroke:white;stroke-width:2}.unit{display:grid;grid-template-columns:40px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.uf{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--pd)}.unit strong,.unit span{display:block}.unit strong{font-size:9px}.unit span{font-size:7px;color:var(--muted)}.tag{padding:6px 8px;border-radius:999px;background:var(--soft);color:var(--pd);font-size:7px;font-weight:900}.pod{height:260px;border-radius:17px;background:linear-gradient(135deg,var(--pd),var(--p),#78c5bf);color:white;padding:24px;position:relative;overflow:hidden}.pod h3{font-size:24px;max-width:330px;margin:80px 0 15px}.tabs{display:flex;gap:5px;margin:15px 0}.tabs button{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:999px;font-size:8px}.tabs button.active{background:var(--p);color:white}.ticket{display:grid;grid-template-columns:.75fr 1.25fr;gap:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:8px;font-weight:800}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:5px}.wide{grid-column:1/-1}@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(max-width:900px){.shell{display:block}.side{display:none}.main{grid-column:auto}.stage{padding:18px}.hero,.grid3,.twocol,.mapgrid,.ticket{grid-template-columns:1fr}.knowledge,.cards3{grid-template-columns:1fr 1fr}.top{padding:0 15px}.search{width:100%}.profile{display:none}.coins{grid-template-columns:repeat(8,110px)}}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><img src="public/logo-phiq.png"><span>Portal do Franqueado</span></div><div class="nav" id="nav"><button data-page="home" class="active">⌂ Início</button><button data-page="base">▤ Base de Conhecimento</button><button data-page="journey">↗ Onboarding & Jornada</button><button data-page="units">♙ Nossos Franqueados</button><button data-page="comms">◁ Comunicados Oficiais</button><button data-page="support">◔ Suporte & CS</button></div><div class="side-title">ATALHOS</div><div class="shortcuts"><div><i>▣</i>Catálogo de Produtos</div><div><i>▥</i>eDocs-Q</div><div><i>◉</i>Lovable (5S/NC)</div><div><i>◆</i>Q3</div><div><i>▦</i>PHIQ Lab</div></div><div class="help"><strong>Precisa de ajuda?</strong><span>Fale com o CS</span><button onclick="go('support')">Abrir chamado →</button></div></aside><main class="main"><header class="top"><label class="search">⌕ <input id="search" placeholder="Buscar conteúdos, documentos, treinamentos..."></label><div class="profile"><div class="avatar">GS</div><div><strong>Gustavo</strong><span>PHIQ · Franqueado</span></div></div></header><div class="stage" id="stage"></div></main></div><script>
const coins=['boas-vindas','treinamento','produtos','primeira-visita','primeiro-orcamento','primeira-venda','equipe-formada','excelencia'];const coinNames=['Boas-vindas','Treinamento Institucional','Conhecimento de Produtos','Primeira Visita','Primeiro Orçamento','Primeira Venda','Equipe Formada','Excelência'];
function coinStrip(){return `<div class="panel" style="margin-top:13px"><div style="display:flex;justify-content:space-between"><div><h3>Suas conquistas</h3><p style="font-size:8px;color:var(--muted)">Cada conquista representa um passo importante na sua evolução como franqueado.</p></div><span style="font-size:8px;color:var(--p);font-weight:800">Ver todas →</span></div><div class="coins">${coins.map((c,i)=>`<div class="coinitem ${i>5?'locked':''}"><img class="coin" src="public/coins/${c}.png"><strong>${coinNames[i]}</strong></div>`).join('')}</div></div>`}
const home=()=>`<section class="screen"><div class="hero"><div><span class="pill">PORTAL DO FRANQUEADO PHIQ</span><h1>Bem-vindo ao seu <span>escritório PHIQ.</span></h1><p>Acompanhe sua jornada, encontre materiais estratégicos e fale com o NAF em um ambiente único.</p><div class="buttons"><button class="btn" onclick="go('journey')">Ver minha jornada →</button><button class="btn ghost" onclick="go('base')">Explorar base de conhecimento</button></div></div><div class="banner"><img src="public/journey-banner.jpg"></div></div><div class="grid3"><div class="panel"><span class="eyebrow">SEU PROGRESSO</span><h3>Jornada PHIQ</h3><div class="progress"><div class="ring"><div><b>58%</b><small>Concluído</small></div></div><div class="ptext"><span>Você está na etapa</span><strong>Formação</strong><p>Fortaleça seus conhecimentos sobre produtos, processos e gestão comercial.</p></div></div></div><div class="panel"><span class="eyebrow">PRÓXIMO MARCO</span><h3 style="margin-top:25px">Concluir treinamento comercial</h3><p style="font-size:8px;color:var(--muted)">Assista ao módulo e responda o quiz.</p><div class="bar"><i></i></div><div style="margin-top:12px;font-size:8px">70%</div></div><div class="panel"><span class="eyebrow">SEU NÍVEL ATUAL</span><div style="display:flex;gap:10px;align-items:center;margin-top:22px"><div class="level">☆</div><div><b>Nível 2</b><div style="font-size:8px;color:var(--muted)">Franqueado em Formação</div></div></div><div style="margin-top:15px"><b style="font-size:22px">320</b><div style="font-size:8px;color:var(--muted)">moedas conquistadas</div></div></div></div>${coinStrip()}<div class="sectiontitle"><div><span class="pill">REDE EM MOVIMENTO</span><h2>O que está acontecendo na PHIQ</h2><p>Atualizações, compromissos e conteúdos para você continuar evoluindo.</p></div></div><div class="twocol"><div class="panel"><h3>Últimos comunicados</h3>${[['Atualização comercial','Novo material de abordagem','Hoje'],['Podcast CDQ','Novo episódio disponível','Ontem'],['Treinamento da rede','Agenda do próximo encontro','25 Set']].map(x=>`<div class="feed"><i>↗</i><div><strong>${x[0]}</strong><span>${x[1]}</span></div><time>${x[2]}</time></div>`).join('')}</div><div class="panel"><h3>Próximos eventos</h3>${[['30 SET','Encontro técnico da rede','15:00 · Online'],['02 OUT','Plantão comercial NAF','10:00 · Online'],['08 OUT','Treinamento de produtos','14:00 · Online']].map(x=>`<div class="event"><div class="date">${x[0]}</div><div><strong>${x[1]}</strong><span>${x[2]}</span></div></div>`).join('')}</div></div><div class="sectiontitle"><div><span class="pill">CONTINUE APRENDENDO</span><h2>Conteúdo recomendado para sua etapa</h2></div></div><div class="cards3"><div class="smallcard"><span>COMERCIAL</span><strong>Treinamento comercial</strong></div><div class="smallcard"><span>OPERAÇÃO</span><strong>Segurança química</strong></div><div class="smallcard"><span>PORTFÓLIO</span><strong>Produtos PHIQ</strong></div></div></section>`;
const base=()=>`<section class="screen"><div class="intro"><span class="pill">BASE DE CONHECIMENTO</span><h1>Encontre o conteúdo certo, <span>sem procurar demais.</span></h1><p>A mesma lógica do Notion, agora em uma biblioteca estruturada, pesquisável e preparada para crescer.</p></div><div class="knowledge">${[['01','Começando na PHIQ','Cultura, papel do franqueado, jornada e primeiros passos.'],['02','Operação & Padrões','Manuais, POPs, limpeza e segurança química.'],['03','Comercial & Crescimento','Abordagem, scripts, segmentos e testes.'],['04','Produtos PHIQ','Catálogo, aplicações e documentos técnicos.'],['05','Biblioteca PHIQ','Treinamentos, vídeos e apresentações.'],['06','Infraestrutura & Wiki','Políticas, cultura e ferramentas de gestão.']].map((x,i)=>`<button class="panel kcard" onclick="openDetail(${i})"><div class="knum">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><span style="font-size:8px;color:var(--p);font-weight:800">Explorar conteúdo →</span></button>`).join('')}</div><div id="detail" class="detail"></div></section>`;
const details=[['Começando na PHIQ',['Visão geral da PHIQ','Papel do Franqueado','Estrutura da jornada','Padrões iniciais','Primeiros passos']],['Operação & Padrões',['Manuais SMART · ÁGIL · MAX','POPs operacionais','Procedimentos de limpeza','Vídeos técnicos','Segurança química']],['Comercial & Crescimento',['Manual de abordagem','Cenário e conflito','Solução PHIQ','Scripts de WhatsApp e telefone','Convite para visita/teste']],['Produtos PHIQ',['Catálogo interno','Aplicações','Diluições','FDS e ficha técnica','POPs relacionados']],['Biblioteca PHIQ',['Treinamentos','Apresentações','Vídeos técnicos','Materiais comerciais','Documentos institucionais']],['Infraestrutura & Wiki',['Política, cultura e códigos','Ishikawa','5 Porquês','5W2H','Matriz GUT','Checklist e fluxograma']]];
function openDetail(i){const d=document.getElementById('detail');const item=details[i];document.querySelector('.knowledge').style.display='none';document.querySelector('.intro').style.display='none';d.style.display='block';d.innerHTML=`<button class="back" onclick="closeDetail()">← Voltar para Base de Conhecimento</button><div class="intro"><span class="pill">CONTEÚDO PHIQ</span><h1>${item[0]}</h1><p>Conteúdo migrado da estrutura do Notion para uma experiência de plataforma.</p></div>${item[1].map((x,j)=>`<details class="accordion" ${j===0?'open':''}><summary>${x}</summary><div>Esta seção preserva o conteúdo e a lógica existente no Notion, mas passa a funcionar com leitura mais clara, navegação, filtros e componentes próprios do Portal PHIQ.</div></details>`).join('')}`}
function closeDetail(){document.getElementById('detail').style.display='none';document.querySelector('.knowledge').style.display='grid';document.querySelector('.intro').style.display='block'}
const journey=()=>`<section class="screen"><div class="intro"><span class="pill">ONBOARDING & JORNADA</span><h1>Progresso visível. <span>Próximo passo claro.</span></h1><p>A jornada deixa de ser apenas informativa e passa a orientar cada etapa da evolução do franqueado.</p></div><div class="rail">${[['✓','Alistamento','100% concluído','done'],['▰','Formação','80% concluído','done'],['⚙','Operação','Em andamento','active'],['♙','Autonomia','Bloqueado','locked'],['★','Excelência','Bloqueado','locked']].map(x=>`<div class="step ${x[3]}"><div class="node">${x[0]}</div><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><div class="grid3"><div class="panel"><h3>Seu progresso na jornada</h3><div class="progress"><div class="ring"><div><b>58%</b><small>Concluído</small></div></div><div class="ptext"><span>Você está na etapa</span><strong>Formação</strong><p>Hora de fortalecer seus conhecimentos.</p></div></div></div><div class="panel"><span class="eyebrow">PRÓXIMO MARCO</span><h3 style="margin-top:25px">Concluir treinamento comercial</h3><div class="bar"><i></i></div></div><div class="panel"><span class="eyebrow">SEU NÍVEL ATUAL</span><h2>Nível 2</h2><p style="font-size:8px;color:var(--muted)">Franqueado em Formação</p></div></div>${coinStrip()}<div class="sectiontitle"><div><span class="pill">ENTENDA SUA JORNADA</span><h2>Regras claras para cada etapa</h2><p>O dashboard mostra onde você está. Esta área explica como avançar.</p></div></div>${['Como funciona a Jornada PHIQ?','Onboarding','Ongoing','Autonomia','Excelência','Como funciona a gamificação?','Critérios de evolução'].map((x,i)=>`<details class="accordion" ${i===0?'open':''}><summary>${x}</summary><div>Conteúdo explicativo da jornada, objetivos, entregáveis, papel do Customer Success e critérios de avanço — migrado da estrutura original do Notion.</div></details>`).join('')}</section>`;
const units=()=>`<section class="screen"><div class="intro"><span class="pill">REDE PHIQ</span><h1>Uma rede conectada e <span>em evolução.</span></h1><p>Veja onde estão as unidades e acompanhe a etapa de cada franqueado.</p></div><div class="mapgrid"><div class="panel"><h3>Franqueados pelo Brasil</h3><div class="map"><svg viewBox="0 0 520 540"><path class="shape" d="M193 34 L252 50 L288 77 L333 91 L362 120 L408 135 L430 170 L420 205 L447 236 L433 270 L409 291 L401 331 L369 351 L356 388 L324 412 L301 455 L267 485 L245 518 L215 493 L198 459 L174 436 L166 402 L145 375 L139 336 L107 311 L88 276 L96 245 L76 211 L91 179 L111 156 L113 119 L151 102 L161 71 Z"/><circle class="pin" cx="343" cy="125" r="8"/><text x="358" y="130" font-size="11">CE</text><circle class="pin" cx="382" cy="170" r="8"/><text x="397" y="175" font-size="11">PB</text><circle class="pin" cx="314" cy="258" r="8"/><text x="329" y="263" font-size="11">BA</text><circle class="pin" cx="373" cy="231" r="8"/><text x="388" y="236" font-size="11">SE</text><text x="250" y="290" font-size="38" font-weight="900" fill="#7bb7b1">BR</text></svg></div></div><div class="panel"><h3>Unidades</h3>${[['CE','Fortaleza','Operação'],['PB','João Pessoa','Excelência'],['BA','Salvador','Formação'],['SE','Aracaju','Operação']].map(x=>`<div class="unit"><div class="uf">${x[0]}</div><div><strong>${x[1]}</strong><span>Franquia PHIQ</span></div><span class="tag">${x[2]}</span></div>`).join('')}</div></div></section>`;

const pages={home,base,journey,units,comms,support};function go(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('stage').innerHTML=pages[id]();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home');
</script></body></html>
